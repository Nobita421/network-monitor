name: CI — Type Check & Build

on:
  push:
    branches: [feat/ui-ux-redesign, master]
  pull_request:
    branches: [master]

jobs:
  typecheck-and-build:
    name: TypeScript Check & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: true
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint check
        run: ./node_modules/.bin/eslint src electron --max-warnings 0

      - name: Unit tests (Vitest)
        run: node ./scripts/run-vitest.mjs

      - name: Build renderer (Vite)
        run: ./node_modules/.bin/vite build --config vite.config.renderer.ts
        env:
          NODE_ENV: production

  package-windows:
    name: Package Windows app
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          standalone: true
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package app (no GeoIP refresh)
        run: pnpm build:no-geoip
