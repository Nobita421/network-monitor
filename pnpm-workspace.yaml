packages:
  - '.'

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

# pnpm v10+ reads overrides from here (package.json `pnpm.overrides` is ignored
# by pnpm >=12; it is kept in sync for older pnpm 9 tooling).
overrides:
  '@tootallnate/once': ^3.0.1
  '@xmldom/xmldom': ^0.9.9
  ajv: ^6.14.0
  brace-expansion@1.1.12: ^1.1.13
  brace-expansion@2.0.2: ^2.0.3
  lodash: ^4.18.1
  lodash-es: ^4.18.1
  minimatch@3.1.2: ^3.1.5
  minimatch@5.1.6: ^5.1.8
  minimatch@9.0.5: ^9.0.7
  picomatch: ^2.3.2
  preact: ^10.29.1
  rollup: ^4.59.0
